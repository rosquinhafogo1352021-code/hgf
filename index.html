<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <title>Radar de precipitação RainViewer | São Paulo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: #f4f4f4;
            background: #080808;
            font-family: Arial, sans-serif;
        }

        .radar-app {
            width: min(100%, 1100px);
            margin: 0 auto;
            border-top: 3px solid #e11d2e;
        }

        .radar-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding: 12px 16px;
        }

        h1 { margin: 0; font-size: 19px; font-weight: 600; }
        .source-link { color: #ff6671; font-size: 13px; }

        #radar-map {
            width: 100%;
            height: min(68vh, 620px);
            min-height: 380px;
            background: #171b20;
        }

        .radar-panel {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(220px, 320px);
            gap: 16px;
            align-items: center;
            padding: 12px 16px;
            border-top: 1px solid #303030;
        }

        .radar-controls {
            display: grid;
            grid-template-columns: auto auto auto minmax(120px, 1fr);
            gap: 8px;
            align-items: center;
        }

        button {
            min-height: 36px;
            padding: 0 11px;
            border: 1px solid #505050;
            border-radius: 4px;
            color: #f4f4f4;
            background: #171717;
            font: inherit;
            cursor: pointer;
        }

        button:enabled:hover, button:enabled:focus-visible {
            border-color: #e11d2e;
            outline: none;
        }

        #play-button { border-color: #e11d2e; }
        #timeline { width: 100%; accent-color: #e11d2e; }

        #radar-time, #radar-status, .legend-title {
            color: #d2d2d2;
            font-size: 12px;
            line-height: 1.4;
        }

        #radar-status { margin: 4px 0 0; }
        .legend { display: grid; gap: 5px; }
        .legend-bar {
            height: 12px;
            border: 1px solid #666;
            background: linear-gradient(90deg,
                #88ddee 0% 8.33%,
                #00a3e0 8.33% 16.66%,
                #0077aa 16.66% 24.99%,
                #005588 24.99% 33.32%,
                #ffee00 33.32% 41.65%,
                #ffaa00 41.65% 49.98%,
                #ff4400 49.98% 58.31%,
                #c10000 58.31% 66.64%,
                #ffaaff 66.64% 74.97%,
                #ff77ff 74.97% 83.3%,
                #ffffff 83.3% 91.63%,
                #00ff00 91.63% 100%);
        }

        .legend-values {
            display: flex;
            justify-content: space-between;
            color: #c7c7c7;
            font-size: 10px;
        }

        .radar-footer {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px 12px;
            color: #aaa;
            font-size: 11px;
        }

        #radar-map .rainviewer-pixels {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        @media (max-width: 650px) {
            #radar-map { height: 58vh; min-height: 360px; }
            .radar-header { align-items: flex-start; flex-direction: column; }
            .radar-panel { grid-template-columns: 1fr; gap: 10px; }
            .radar-controls { grid-template-columns: auto auto auto; }
            #timeline { grid-column: 1 / -1; grid-row: 2; }
            .radar-footer { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="radar-app">
        <header class="radar-header">
            <h1>Radar de precipitação · RainViewer</h1>
            <a class="source-link" href="https://www.rainviewer.com/weather-radar-map-live.html" target="_blank" rel="noopener noreferrer">Fonte RainViewer</a>
        </header>
        <div id="radar-map" role="application" aria-label="Pixels de precipitação RainViewer sobre o estado de São Paulo"></div>
        <section class="radar-panel" aria-label="Controles e legenda do radar">
            <div>
                <div class="radar-controls">
                    <button id="previous-button" type="button" aria-label="Quadro anterior" disabled>Anterior</button>
                    <button id="play-button" type="button" aria-pressed="false" disabled>Iniciar animação</button>
                    <button id="next-button" type="button" aria-label="Próximo quadro" disabled>Próximo</button>
                    <input id="timeline" type="range" min="0" max="0" value="0" step="1" aria-label="Selecionar horário do radar" disabled>
                </div>
                <p id="radar-time">Carregando imagens RainViewer...</p>
                <p id="radar-status" role="status" aria-live="polite">São Paulo · RainViewer</p>
            </div>
            <div class="legend" aria-label="Legenda oficial RainViewer dBZ">
                <span class="legend-title">Refletividade · dBZ (paleta RainViewer)</span>
                <div class="legend-bar" aria-hidden="true"></div>
                <div class="legend-values" aria-hidden="true">
                    <span>15</span><span>20</span><span>25</span><span>30</span><span>35</span><span>40</span><span>45</span><span>50</span><span>55</span><span>60</span><span>65</span><span>75+ dBZ</span>
                </div>
            </div>
        </section>
        <footer class="radar-footer">
            <span id="frame-counter">Aguardando dados RainViewer</span>
            <span>Tiles originais RainViewer · sem suavização</span>
        </footer>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        (() => {
            const mapElement = document.getElementById("radar-map");
            const timeline = document.getElementById("timeline");
            const playButton = document.getElementById("play-button");
            const previousButton = document.getElementById("previous-button");
            const nextButton = document.getElementById("next-button");
            const timeLabel = document.getElementById("radar-time");
            const statusLabel = document.getElementById("radar-status");
            const frameCounter = document.getElementById("frame-counter");
            const saoPauloBounds = L.latLngBounds([[-25.310889, -53.108193], [-19.779185, -44.160514]]);
            const map = L.map(mapElement, {
                minZoom: 5,
                maxZoom: 10,
                maxBounds: saoPauloBounds,
                maxBoundsViscosity: 1,
                zoomSnap: 1
            }).setView([-23.55, -46.63], 6);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }).addTo(map);

            fetch("radar/sao-paulo.geojson", { cache: "force-cache" })
                .then(response => {
                    if (!response.ok) throw new Error("Limite estadual indisponível.");
                    return response.json();
                })
                .then(feature => {
                    const stateBoundary = L.geoJSON(feature, {
                        interactive: false,
                        style: { color: "#e11d2e", weight: 2, opacity: 0.95, fill: false }
                    }).addTo(map);
                    map.fitBounds(stateBoundary.getBounds(), { padding: [10, 10] });
                    map.setMaxBounds(saoPauloBounds);
                })
                .catch(() => {
                    map.fitBounds(saoPauloBounds, { padding: [10, 10] });
                });

            let host = "";
            let frames = [];
            let currentFrame = 0;
            let radarLayer = null;
            let playbackTimer = null;

            function showFrame(index) {
                if (frames.length === 0) return;
                currentFrame = Math.max(0, Math.min(frames.length - 1, index));
                const frame = frames[currentFrame];
                const tileUrl = `${host}${frame.path}/256/{z}/{x}/{y}/2/0_1.png`;
                timeline.value = String(currentFrame);
                frameCounter.textContent = `Quadro ${currentFrame + 1} de ${frames.length}`;
                timeLabel.textContent = `RainViewer · ${new Date(frame.time * 1000).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", dateStyle: "short", timeStyle: "short" })}`;

                if (radarLayer) map.removeLayer(radarLayer);
                radarLayer = L.tileLayer(tileUrl, {
                    minZoom: 0,
                    maxZoom: 10,
                    tileSize: 256,
                    opacity: 0.9,
                    noWrap: true,
                    updateWhenIdle: true,
                    keepBuffer: 0,
                    className: "rainviewer-pixels"
                }).addTo(map);
            }

            function stopAnimation() {
                if (playbackTimer !== null) window.clearTimeout(playbackTimer);
                playbackTimer = null;
                playButton.textContent = "Iniciar animação";
                playButton.setAttribute("aria-pressed", "false");
            }

            function advanceFrame() {
                currentFrame = (currentFrame + 1) % frames.length;
                showFrame(currentFrame);
                playbackTimer = window.setTimeout(advanceFrame, 600);
            }

            function loadFrames() {
                fetch(`https://api.rainviewer.com/public/weather-maps.json?t=${Date.now()}`, { cache: "no-store" })
                    .then(response => {
                        if (!response.ok) throw new Error("A API RainViewer está indisponível.");
                        return response.json();
                    })
                    .then(data => {
                        if (!data.radar || !Array.isArray(data.radar.past) || data.radar.past.length < 2) {
                            throw new Error("O RainViewer não retornou quadros suficientes para animar.");
                        }
                        const wasAtLatest = frames.length === 0 || currentFrame >= frames.length - 1;
                        host = data.host;
                        frames = data.radar.past.slice(-12);
                        timeline.max = String(frames.length - 1);
                        timeline.disabled = false;
                        playButton.disabled = false;
                        previousButton.disabled = false;
                        nextButton.disabled = false;
                        currentFrame = wasAtLatest ? frames.length - 1 : Math.min(currentFrame, frames.length - 1);
                        showFrame(currentFrame);
                        statusLabel.textContent = "Pixels RainViewer atualizados.";
                    })
                    .catch(error => {
                        statusLabel.textContent = error.message;
                    });
            }

            previousButton.addEventListener("click", () => {
                stopAnimation();
                showFrame(currentFrame - 1);
            });
            nextButton.addEventListener("click", () => {
                stopAnimation();
                showFrame(currentFrame + 1);
            });
            timeline.addEventListener("input", () => {
                stopAnimation();
                showFrame(Number(timeline.value));
            });
            playButton.addEventListener("click", () => {
                if (playbackTimer !== null) {
                    stopAnimation();
                    return;
                }
                playButton.textContent = "Pausar";
                playButton.setAttribute("aria-pressed", "true");
                playbackTimer = window.setTimeout(advanceFrame, 600);
            });

            map.setMaxBounds(saoPauloBounds);
            loadFrames();
            window.setInterval(loadFrames, 5 * 60 * 1000);
            new ResizeObserver(() => map.invalidateSize({ pan: false })).observe(mapElement);
        })();
    </script>
</body>
</html>
