name: Publish IPMET GIS snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GIS image tools
        run: python -m pip install Pillow

      - name: Restore recent GIS frames
        uses: actions/cache/restore@v4
        with:
          path: .radar-cache/radar
          key: ipmet-gis-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ipmet-gis-

      - name: Capture current WMS and TITAN data
        run: |
          mkdir -p public
          cp index.html gis.html public/
          python tools/update-ipmet-gis.py .radar-cache/radar public/radar

      - name: Save rolling GIS history
        uses: actions/cache/save@v4
        with:
          path: .radar-cache/radar
          key: ipmet-gis-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4